<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bookings — Tarmac admin</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&display=swap">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/admin.css">
    <script src="js/admin.js" defer></script>
</head>

<body class="admin">
    <header class="admin__bar">
        <div class="wrap admin__bar-inner">
            <a class="logo" href="/">
                <img class="logo__mark" src="img/favicon.svg" alt="" width="36" height="36">
                <span class="logo__word">tarmac<small>bookings desk</small></span>
            </a>
            <button class="btn btn--ghost" type="button" id="logout" hidden>Sign out</button>
        </div>
    </header>

    <main class="wrap admin__main">
        <form class="admin__login" id="login" novalidate>
            <h1>Sign in to the bookings desk</h1>
            <div class="field">
                <label for="token">Admin token</label>
                <input id="token" type="password" autocomplete="current-password" required>
            </div>
            <p class="form-error" id="login-error" role="alert" hidden></p>
            <button class="btn btn--primary" type="submit">Sign in</button>
            <p class="admin__hint">The token is ADMIN_TOKEN from the .env file. Without it, the server prints a one-time token when it starts.</p>
        </form>

        <div id="desk" hidden>
            <section class="admin__stats" id="stats" aria-label="Summary"></section>

            <section aria-labelledby="bookings-title">
                <div class="admin__section-head">
                    <h2 id="bookings-title">Bookings</h2>
                    <div class="admin__tools">
                        <label class="inline-select">Status
                            <select id="status-filter">
                                <option value="">All</option>
                                <option value="confirmed">Confirmed</option>
                                <option value="picked-up">Picked up</option>
                                <option value="returned">Returned</option>
                                <option value="cancelled">Cancelled</option>
                            </select>
                        </label>
                        <input class="admin__search" id="search" type="search" placeholder="Search name, email or reference" aria-label="Search bookings">
                        <button class="btn btn--ghost" type="button" id="refresh">Refresh</button>
                    </div>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th scope="col">Reference</th>
                                <th scope="col">Driver</th>
                                <th scope="col">Car</th>
                                <th scope="col">Airport</th>
                                <th scope="col">Dates</th>
                                <th scope="col" class="num">Total</th>
                                <th scope="col">Status</th>
                            </tr>
                        </thead>
                        <tbody id="bookings"></tbody>
                    </table>
                </div>
            </section>

            <section aria-labelledby="callbacks-title">
                <div class="admin__section-head">
                    <h2 id="callbacks-title">Call-back requests</h2>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th scope="col">Called</th>
                                <th scope="col">Name</th>
                                <th scope="col">Phone</th>
                                <th scope="col">When</th>
                                <th scope="col">Received</th>
                            </tr>
                        </thead>
                        <tbody id="callbacks"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>

</html>
